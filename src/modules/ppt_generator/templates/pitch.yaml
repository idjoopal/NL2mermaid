name: pitch
description: "스타트업 피치덱"
slides:
  - id: cover
    type: title_slide
    placeholders:
      - {name: title, required: true}
      - {name: subtitle}
  - id: problem
    type: content_slide
    placeholders:
      - {name: title}
      - {name: bullets, type: list}
  - id: solution
    type: content_slide
    placeholders:
      - {name: title}
      - {name: bullets, type: list}
  - id: market
    type: chart_slide
    chart_type: column
    placeholders:
      - {name: title}
      - {name: chart_data}
  - id: team
    type: content_slide
    placeholders:
      - {name: title}
      - {name: bullets, type: list}
  - id: ask
    type: title_slide
    placeholders:
      - {name: title, required: true}
      - {name: subtitle}
theme:
  primary_color: "1A3A6E"
  secondary_color: "EEF2FA"
  accent_color: "E8A020"
  font_family: "맑은 고딕"
  font_size_title: 40
  font_size_subtitle: 24
  font_size_heading: 26
  font_size_body: 18
