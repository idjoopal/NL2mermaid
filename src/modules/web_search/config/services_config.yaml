# Web Search Services Configuration
# 각 서비스별 설정을 여기에서 유저가 직접 조정하세요.
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │  API 키는 agent_env/web_search.env 파일에서 환경변수로 관리합니다.    │
# │  여기에 api_key 값을 직접 입력할 수도 있지만, .env 권장.               │
# └─────────────────────────────────────────────────────────────────────┘

services:

  # ── Tavily Search ──────────────────────────────────────────────────────
  tavily_search:
    enabled: true
    api_key: ""           # 환경변수 우선: TAVILY_API_KEY
    api_base_url: "https://api.tavily.com"  # Tavily API 엔드포인트 기본 URL
    timeout: 30           # 요청 타임아웃 (초)
    max_results: 5        # 기본 결과 수 (최대 20)

    # 검색 동작 기본값 (LLM이 파라미터를 명시하지 않을 때 사용)
    search_depth: "advanced"           # "basic" | "advanced" | "fast" | "ultra-fast"
    chunks_per_source: 3            # 소스당 청크 수 (1–3, advanced 전용)
    topic: "news"                # "general" | "news" | "finance"
    start_date: ""                  # 시작 날짜 (YYYY-MM-DD), 빈 값이면 미적용
    end_date: ""                    # 종료 날짜 (YYYY-MM-DD), 빈 값이면 미적용
    include_answer: true            # LLM 요약 답변 포함 여부
    include_raw_content: false      # 원시 콘텐츠 포함: false | true | "markdown" | "text"
    include_images: false           # 이미지 포함
    include_image_descriptions: false
    include_favicon: false          # 파비콘 URL 포함
    include_domains: []             # 포함할 도메인 (최대 300개)
    exclude_domains: []             # 제외할 도메인 (최대 150개)
    country: ""                     # 국가 이름 (예: "south korea", "united states")
    auto_parameters: false          # true면 Tavily가 파라미터 자동 최적화
    include_usage: false            # 크레딧 사용량 정보 포함

  # ── Perplexity Search ─────────────────────────────────────────────────
  perplexity:
    enabled: true
    api_key: ""           # 환경변수 우선: PERPLEXITY_API_KEY
    api_base_url: "https://api.perplexity.ai"  # Perplexity API 엔드포인트 기본 URL
    timeout: 30           # 요청 타임아웃 (초)
    max_results: 10       # 기본 결과 수

    # Perplexity 특화 설정
    country: ""                   # ISO 국가 코드 (예: "US", "KR", "JP")
    search_domain_filter: []      # 도메인 필터 (예: ["example.com"] 또는 ["-reddit.com"])
    search_language_filter: []    # 언어 필터 (예: ["en", "ko"]) — ISO 639-1 코드
    max_tokens_per_page: 4096     # 페이지당 최대 토큰 수
    max_tokens: 10000             # 전체 토큰 예산
    search_recency_filter: ""     # "hour" | "day" | "week" | "month" | "year"
    search_after_date_filter: ""  # YYYY-MM-DD
    search_before_date_filter: "" # YYYY-MM-DD
    last_updated_after_filter: "" # YYYY-MM-DD
    last_updated_before_filter: ""# YYYY-MM-DD
    display_server_time: false    # true면 응답에 server_time 포함
